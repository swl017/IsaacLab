# MAPPO-RNN configuration for Quadcopter environment
# This config is loaded when using --algorithm MAPPO_RNN

seed: 42

# Model parameters
models:
  policy:
    class_name: mappo_rnn  # Will use MAPPORNNPolicy from scripts/reinforcement_learning/skrl/mappo_rnn.py
    hidden_size: 256       # Ticket 048 (2026-06-12): flipped 64 → 256 (wide).
    gru_num_layers: 1      # Width sweep 64/128/256 @ 200k seed=42: aggregate task
    gru_hidden_size: 256   # quality flat, but at DEPLOY (Pegasus+PX4 SITL) wide is the
                           # calmest, most sim2real-robust policy — lowest body speed
                           # (0.62 vs 1.29 m/s) + wander (1.69 vs 4.58 m), gimbal yaw
                           # std halved (5.7° vs 10.7°), estimation tied with baseline.
                           # mid disqualified (degenerate close-in strategy + KL=0.81
                           # blowup). Width is ~free here (env-sim-bound, ~1.0× wall).
                           # gru_num_layers held at 1 (depth is a separate axis).
                           # See doc/experiments/2026-06-11_ticket048_network_width_sweep.md.
                           # Single-seed; 2–3-seed baseline-vs-wide re-run is the
                           # confirmation follow-up if needed.
    initial_log_std: -0.5  # σ ≈ 0.6
    min_log_std: -5.0      # σ_min ≈ 0.007, prevents collapse
    max_log_std: 0.4       # σ_max ≈ 1.49, caps exploration
                           # Ticket 047 Slice 3 (2026-06-04): tightened 0.7 → 0.4.
                           # The 0.7 cap let σ blow to 2.014 by ~32k of training,
                           # locking the policy at max exploration and starving
                           # reward-shape gradient. With 0.4, σ saturates at 1.49
                           # — bounded but still wide enough for the explore-phase
                           # curriculum (see entropy_loss_schedule below).
                           # Note: torch.clamp has zero gradient in the saturated
                           # region, so log_std doesn't tighten back from the cap
                           # even when entropy bonus is small. Smooth-bound fix
                           # is logged as a follow-up ticket.

  value:
    class_name: mappo_rnn  # Will use MAPPORNNValue
    hidden_size: 256       # Ticket 048: flipped 64 → 256 (wide), mirrors policy.
    gru_num_layers: 1
    gru_hidden_size: 256

# Agent configuration
agent:
  # RNN-specific parameters
  sequence_length: 32        # RNN sequence length for training
  
  # Burn-in steps for hidden state warm-up (0 = disabled, must be < sequence_length)
  # Disable it at all times
  burn_in_steps: 0

  # D steps to mask from loss at episode start (0 = disabled, use for delay compensation)
  # Do match with delay using hydra override
  episode_start_mask_steps: 8  

  # PPO parameters
  rollouts: 32              # Number of rollouts before updating
  learning_epochs: 3         # Number of learning epochs during each update
  mini_batches: 8            # Number of mini batches (lower = better sequence sampling)

  discount_factor: 0.99      # Discount factor (gamma)
  lambda: 0.95               # TD(lambda) coefficient for GAE

  learning_rate: 0.0003     # Learning rate (lower = better RNN stability)
  random_timesteps: 0        # Random exploration steps
  learning_starts: 0         # Learning starts after this many steps

  # Gradient and clipping
  grad_norm_clip: 0.3        # Gradient norm clipping (lower = more conservative)
  ratio_clip: 0.2            # PPO ratio clipping
  value_clip: 0.2            # Value clipping
  clip_predicted_values: true

  # Loss scales
  entropy_loss_scale: 0.01   # Entropy loss scaling (= start_value when schedule below is active)
  value_loss_scale: 1.0      # Value loss scaling

  # Ticket 047 — linear curriculum on entropy_loss_scale.
  # When all three fields are non-null, entropy_loss_scale linearly interpolates
  # from the value above (= start_value) toward end_value between start_step and
  # end_step (clamped on both ends). To disable, set end_value: null.
  #
  # Slice 3 defaults (2026-06-04): keep entropy_loss_scale=0.01 (full exploration)
  # through 0-120k while the env's behavioral curriculum (tracking, safety,
  # moving_target, dynamics, noise) ramps up; ramp to 0.001 over 120k-200k as
  # the delay / dropout perception phases land; hold at 0.001 for the final
  # 200k-400k commitment regime. Validated by `2026-06-04_..._ticket047_D_curriculum_cold`
  # @ 400k: +7.3% pair_valid_rate, +21.5% triangulation, +22.7% total reward vs
  # t046 baseline; the policy survived the delay-onset cliff and recovered.
  entropy_loss_schedule:
    end_value: 0.001    # final value; null ⇒ schedule disabled
    start_step: 120000  # timestep at which the ramp begins
    end_step: 200000    # timestep at which the ramp completes

  # KL divergence — PPO early-stop threshold.
  # Keep this aligned with KLAdaptiveLR's high band so PPO early-stop and
  # LR reduction trigger together, but leave enough room for curriculum
  # transitions such as fixed/random delay to adapt instead of starving updates.
  kl_threshold: 0.04         # KL divergence threshold for early stopping

  # Learning rate scheduler
  # Threshold layout (assumes scheduler kl_factor = 2):
  #   kl < 0.010  → KLAdaptiveLR raises LR (×1.25, capped by max_lr)
  #   0.010-0.040 → dead zone, LR unchanged, no early-stop
  #   kl > 0.040  → PPO early-stop AND KLAdaptiveLR lowers LR (both fire together)
  # The scheduler target (0.02) is half of the PPO early-stop threshold (0.04)
  # so that scheduler_high = target × kl_factor = 0.02 × 2 = 0.04 = early-stop.
  # Do NOT change kl_threshold here without updating agent.kl_threshold above
  # (or kl_factor below) — the alignment depends on the 2:1 ratio.
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.02       # Scheduler target; high-band = 0.02 × kl_factor = 0.04
    kl_factor: 2.0           # Pinned explicitly so threshold alignment doesn't drift
    lr_factor: 1.25          # Smaller LR adjustments avoid one-way ratcheting to min_lr
    min_lr: 3.0e-4           # Preserve adaptation capacity after curriculum shifts
    max_lr: 1.5e-3           # Cap to prevent runaway LR climb while allowing adaptation

  # Preprocessors
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null  # Will be set automatically

  shared_state_preprocessor: RunningStandardScaler
  shared_state_preprocessor_kwargs: null  # Will be set automatically

  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs:
    size: 1
    device: null  # Will be set automatically

  # Other settings
  rewards_shaper: null
  time_limit_bootstrap: true
  mixed_precision: false

  # Experiment tracking
  experiment:
    directory: iris_ma6
    experiment_name: "09762f259f_ticket045_task_difficulty_tuning"
    write_interval: auto
    checkpoint_interval: auto
    store_separately: false
    wandb: false
    wandb_kwargs: {}

# Trainer configuration
trainer:
  timesteps: 400000          # Total training timesteps
  headless: true
  environment_info: log
